<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body, html {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: black;
    font-family: Arial, sans-serif;
    color: white;
  }

  #controls {
    width: 100%;
    padding: 8px;
    background: #111;
    box-sizing: border-box;
  }

  #urlInput {
    width: 75%;
    padding: 8px;
    font-size: 14px;
    border-radius: 6px;
    border: none;
  }

  #loadBtn {
    padding: 8px 14px;
    font-size: 14px;
    border: none;
    background: #28a745;
    color: white;
    border-radius: 6px;
    margin-left: 4px;
  }

  /* ==== CROP WINDOW ==== */
  /* This is the visible “hole”. Everything outside is hidden. */
  #crop-box {
    width: 360px;      /* visible width (adjust for more/less plastic) */
    height: 760px;     /* visible height */
    overflow: hidden;
    position: relative;
    margin: 0 auto;
    background: black;
  }

  /* The full VDO.Ninja video */
  iframe {
    position: absolute;
    top: -210px;       /* move video UP  (more negative = show lower part) */
    left: -70px;       /* move video LEFT (more negative = show more right side) */
    width: 720px;      /* “real” video width inside */
    height: 1440px;    /* “real” video height inside */
    border: none;
  }
</style>
</head>

<body>

<div id="controls">
  <input type="text" id="urlInput" placeholder="Paste VDO.Ninja view link here">
  <button id="loadBtn" onclick="loadVideo()">Load</button>
</div>

<div id="crop-box">
  <iframe id="videoFrame" src=""></iframe>
</div>

<script>
function loadVideo() {
    let url = document.getElementById("urlInput").value.trim();
    if (!url) return;

    if (!url.startsWith("https://") && !url.startsWith("http://")) {
        alert("Please paste a valid VDO.Ninja link.");
        return;
    }

    document.getElementById("videoFrame").src = url;
}
</script>

</body>
</html>
