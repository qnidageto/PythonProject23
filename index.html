<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Stream Viewer</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }

        header {
            background-color: #333;
            color: white;
            padding: 10px 20px;
            text-align: center;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        input[type="text"] {
            padding: 10px;
            width: 300px;
            margin-bottom: 20px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        /* ===== DEFAULT SIZE (DESKTOP + MOBILE) ===== */
        #video-container {
            margin-top: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            background: black;
        }

        /* "default-size" is what we later scale up in fullscreen */
        #video-container.default-size {
            width: 650px;
            height: 1030px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            input[type="text"] {
                width: 90vw;
                max-width: 360px;
                font-size: 14px;
                margin-bottom: 10px;
            }

            button {
                font-size: 14px;
                padding: 8px 16px;
            }

            #video-container.default-size {
                margin-top: 10px;
                width: 325px;
                height: 515px;
            }
        }

        #video {
            position: absolute;
            top: -310px;
            left: -50px;
            width: 739px;
            height: 1600px;
            border: none;
        }

        @media (max-width: 768px) {
            #video {
                top: -155px;
                left: -25px;
                width: 369.5px;
                height: 800px;
            }
        }

        #fullscreen-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 10px 14px;
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 22px;
            z-index: 9999;
        }

        #fullscreen-btn:hover {
            background: rgba(0,0,0,0.9);
        }

        @media (max-width: 768px) {
            #fullscreen-btn {
                top: 6px;
                left: 6px;
                font-size: 20px;
                padding: 8px 10px;
            }
        }

        /* ===== DESKTOP BROWSER NATIVE FULLSCREEN ===== */
        #video-container:fullscreen,
        #video-container:-webkit-full-screen {
            /* nothing here so browser handles it normally on desktop */
        }

        /* ===== iOS "FAKE FULLSCREEN" ===== */
        #video-container.fake-fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            margin: 0;
            border-radius: 0;
            z-index: 9998;
        }

        /* We scale the whole container from its default size */
        #video-container.fullscreen-scale {
            transform-origin: top left;
        }
    </style>
</head>
<body>

<header>
    <h1>Stream Viewer</h1>
</header>

<div class="container">

    <input type="text" id="streamURL" value="https://vdo.ninja/?view=Pp3zQwa"
           placeholder="Enter stream URL" />


    <button id="goButton">Go</button>

    <!-- NOTE: default-size class is important for scaling -->
    <div id="video-container" class="default-size">
        <iframe id="video"
                src=""
                frameborder="0"
                allow="fullscreen; camera; microphone"
                allowfullscreen
                webkitallowfullscreen
                mozallowfullscreen>
        </iframe>

        <button id="fullscreen-btn">⛶</button>
    </div>

</div>

<script>
    /* ====== LOAD STREAM ====== */
    document.getElementById('goButton').addEventListener('click', function () {
        const url = document.getElementById('streamURL').value.trim();
        const urlPattern = /^https?:\/\/[^ ]+$/;

        if (urlPattern.test(url)) {
            document.getElementById('video').src = url;
        } else {
            alert("Please enter a valid stream URL.");
        }
    });

    /* ====== Fullscreen helpers (desktop) ====== */
    function openFullscreen(elem) {
        if (!elem) return null;
        if (elem.requestFullscreen) return elem.requestFullscreen();
        if (elem.webkitRequestFullscreen) return elem.webkitRequestFullscreen();
        if (elem.msRequestFullscreen) return elem.msRequestFullscreen();
    }

    function closeFullscreen() {
        if (document.exitFullscreen) return document.exitFullscreen();
        if (document.webkitExitFullscreen) return document.webkitExitFullscreen();
        if (document.msExitFullscreen) return document.msExitFullscreen();
    }

    function isFullscreenActive() {
        return document.fullscreenElement ||
               document.webkitFullscreenElement ||
               document.msFullscreenElement ||
               null;
    }

    /* ====== iOS detection ====== */
    const isIOS =
        /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.userAgent.includes("Mac") && "ontouchend" in document);

    const fsBtn = document.getElementById('fullscreen-btn');
    const container = document.getElementById('video-container');

    /* Scale function: keeps the crop identical, just bigger */
    function applyFullscreenScale() {
        const w = container.offsetWidth;
        const h = container.offsetHeight;

        const scaleX = window.innerWidth / w;
        const scaleY = window.innerHeight / h;
        const scale = Math.min(scaleX, scaleY);

        container.style.transform = `scale(${scale})`;
    }

    fsBtn.addEventListener('click', function () {
        if (isIOS) {
            /* Fake fullscreen on iOS while preserving crop */
            const goingFullscreen = !container.classList.contains('fake-fullscreen');

            if (goingFullscreen) {
                container.classList.add('fake-fullscreen', 'fullscreen-scale');
                container.classList.remove('default-size');
                applyFullscreenScale();
            } else {
                container.classList.remove('fake-fullscreen', 'fullscreen-scale');
                container.classList.add('default-size');
                container.style.transform = 'none';
            }
        } else {
            /* Real fullscreen on non-iOS (desktop, Android, etc.) */
            if (!isFullscreenActive()) {
                openFullscreen(container);
            } else {
                closeFullscreen();
            }
        }
    });

    /* Recalculate scale if the orientation / size changes while in fake fullscreen */
    window.addEventListener('resize', () => {
        if (isIOS && container.classList.contains('fake-fullscreen')) {
            applyFullscreenScale();
        }
    });
</script>

</body>
</html>
