<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }
        header {
            background-color: #333;
            color: white;
            padding: 10px 20px;
            text-align: center;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        input[type="text"] {
            padding: 10px;
            width: 300px;
            margin-bottom: 20px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        #video-container {
            margin-top: 20px;
            width: 80%;
            max-width: 800px;
            height: 300px; /* Set a height for proper display */
            border: 1px solid #ccc;
            border-radius: 10px;
            overflow: hidden; /* Hide anything outside the container */
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            object-fit: cover; /* Ensure video fills the container */
            object-position: center; /* Center the video within the container */
        }
    </style>
</head>
<body>

<header>
    <h1>Stream Viewer</h1>
</header>

<div class="container">
    <!-- Input Bar for the URL -->
    <input type="text" id="streamURL" value="https://vdo.ninja/?view=" placeholder="Enter asdgkdkuqg ID after ?view=" />

    <!-- Go Button -->
    <button id="goButton">Go</button>

    <!-- Video Container with iframe -->
    <div id="video-container">
        <iframe id="video" src="" allow="camera; microphone;" frameborder="0">
            Your browser does not support iframes.
        </iframe>
    </div>
</div>

<script>
    // Handle Go button click
    document.getElementById('goButton').addEventListener('click', function() {
        const url = document.getElementById('streamURL').value.trim();

        // Check if the URL is not empty and matches a valid vdo.ninja URL format
        const urlPattern = /^(https?:\/\/)?(www\.)?vdo\.ninja\/\S+$/;

        if (urlPattern.test(url)) {
            // Set the iframe src to the provided URL
            document.getElementById('video').src = url;
        } else {
            alert("Please enter a valid vdo.ninja stream URL.");
        }
    });
</script>

</body>
</html>
