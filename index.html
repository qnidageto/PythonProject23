<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Viewer</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }

        header {
            background-color: #333;
            color: white;
            padding: 10px 20px;
            text-align: center;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        input[type="text"] {
            padding: 10px;
            width: 300px;
            margin-bottom: 20px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        /* === DESKTOP / DEFAULT SIZE (CROPPED VIEW) === */
        #video-container {
            margin-top: 20px;
            width: 650px;        /* +10px right */
            height: 1030px;
            border: 1px solid #ccc;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            background: black;
        }

        #video {
            position: absolute;
            top: -310px;         /* +10px top */
            left: -50px;
            width: 739px;
            height: 1600px;
            border: none;
        }

        /* Fullscreen button: TOP-LEFT + bigger */
        #fullscreen-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 10px 14px;
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 22px;
            z-index: 9999;
        }

        #fullscreen-btn:hover {
            background: rgba(0,0,0,0.9);
        }

        /* === MOBILE VERSION === */
        @media (max-width: 768px) {

            .container {
                padding: 10px;
            }

            input[type="text"] {
                width: 90vw;
                max-width: 360px;
                font-size: 14px;
                margin-bottom: 10px;
            }

            button {
                font-size: 14px;
                padding: 8px 16px;
            }

            #video-container {
                margin-top: 10px;
                width: 325px;        /* +5px (half of 10) */
                height: 515px;
            }

            #video {
                top: -155px;        /* +5px (half of 10) */
                left: -25px;
                width: 369.5px;
                height: 800px;
            }

            /* Fullscreen button also shrinks slightly */
            #fullscreen-btn {
                top: 6px;
                left: 6px;
                font-size: 20px;
                padding: 8px 10px;
            }
        }

        /* Optional: when container is fullscreen you can later tweak size
           but cropping stays the same either way, because iframe is still
           bigger and shifted with overflow:hidden on the container. */
        #video-container:fullscreen,
        #video-container:-webkit-full-screen {
            /* you can keep default size or set to full viewport if you want:
               width: 100vw;
               height: 100vh;
            */
        }

    </style>

</head>
<body>

<header>
    <h1>Stream Viewer</h1>
</header>

<div class="container">

    <!-- URL Input -->
    <input type="text" id="streamURL" value="https://vdo.ninja/?view=Pp3zQwa"
           placeholder="Enter stream URL" />
    test
    <!-- Go button -->
    <button id="goButton">Go</button>

    <!-- Video container with crop -->
    <div id="video-container">

        <!-- iFrame with VDO.Ninja stream -->
        <iframe id="video"
                src=""
                frameborder="0"
                allow="fullscreen; camera; microphone"
                allowfullscreen
                webkitallowfullscreen
                mozallowfullscreen>
        </iframe>

        <!-- FULLSCREEN BUTTON -->
        <button id="fullscreen-btn">⛶</button>
    </div>

</div>


<script>
    /* ====== LOAD STREAM ====== */
    document.getElementById('goButton').addEventListener('click', function () {
        const url = document.getElementById('streamURL').value.trim();
        const urlPattern = /^(https?:\/\/)?(www\.)?vdo\.ninja\/\S+$/;

        if (urlPattern.test(url)) {
            document.getElementById('video').src = url;
        } else {
            alert("Please enter a valid vdo.ninja URL.");
        }
    });

    /* =====================================================
       FULLSCREEN: USE THE CROPPING CONTAINER ONLY
       (so we keep the exact same cropped view in fullscreen)
       ===================================================== */

    function openFullscreen(elem) {
        if (!elem) return null;

        if (elem.requestFullscreen) {
            return elem.requestFullscreen();
        } else if (elem.webkitRequestFullscreen) { // iPhone/iPad Safari
            return elem.webkitRequestFullscreen();
        } else if (elem.msRequestFullscreen) { // Legacy
            return elem.msRequestFullscreen();
        }

        return null;
    }

    function closeFullscreen() {
        if (document.exitFullscreen) {
            document.exitFullscreen();
        } else if (document.webkitExitFullscreen) { // iPhone/iPad Safari
            document.webkitExitFullscreen();
        } else if (document.msExitFullscreen) {
            document.msExitFullscreen();
        }
    }

    function isFullscreenActive() {
        return document.fullscreenElement ||
               document.webkitFullscreenElement ||
               document.msFullscreenElement ||
               null;
    }

    // We don't care about iframe vs container anymore:
    // We ALWAYS fullscreen the container to preserve the crop.
    document.getElementById('fullscreen-btn').addEventListener('click', function () {
        const container = document.getElementById('video-container');

        if (!isFullscreenActive()) {
            openFullscreen(container);
        } else {
            closeFullscreen();
        }
    });
</script>

</body>
</html>
