<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }
        header {
            background-color: #333;
            color: white;
            padding: 10px 20px;
            text-align: center;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        input[type="text"] {
            padding: 10px;
            width: 300px;
            margin-bottom: 20px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        #video-container {
            margin-top: 20px;
            width: 80%;
            max-width: 800px;
            border: 1px solid #ccc;
            border-radius: 10px;
            overflow: hidden;
        }
        #video {
            width: 100%;
            height: 300px;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        #video-container.fullscreen #video {
            width: 100%;
            height: 100vh;
            transform: none;
        }
        .qr-container {
            margin-top: 20px;
        }
        .qr-input {
            display: none;
        }
        .qr-label {
            padding: 10px 20px;
            background-color: #555;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }
        .qr-label:hover {
            background-color: #444;
        }
        .qr-container input {
            display: none;
        }
        .expand-button {
            margin-top: 10px;
            padding: 5px 10px;
            background-color: #008CBA;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .expand-button:hover {
            background-color: #007B8C;
        }
    </style>
</head>
<body>

<header>
    <h1>Stream Viewer</h1>
</header>

<div class="container">
    <!-- Input Bar for the URL -->
    <input type="text" id="streamURL" placeholder="Enter vdo.ninja stream URL" />

    <!-- Go Button -->
    <button id="goButton">Go</button>

    <!-- Video Container -->
    <div id="video-container">
        <video id="video" controls>
            Your browser does not support the video tag.
        </video>
    </div>

    <!-- QR Code Scanning Section -->
    <div class="qr-container">
        <label for="qr-upload" class="qr-label">Scan QR Code</label>
        <input type="file" id="qr-upload" class="qr-input" accept="image/*" onchange="handleFileSelect(event)">
    </div>

    <!-- Expand Button -->
    <button class="expand-button" id="expandButton">Expand to Fullscreen</button>
</div>

<script>
    // Handle Go button click
    document.getElementById('goButton').addEventListener('click', function() {
        const url = document.getElementById('streamURL').value;
        if (url) {
            document.getElementById('video').src = url;
        }
    });

    // Handle Fullscreen toggle
    document.getElementById('expandButton').addEventListener('click', function() {
        const videoContainer = document.getElementById('video-container');
        if (videoContainer.classList.contains('fullscreen')) {
            videoContainer.classList.remove('fullscreen');
        } else {
            videoContainer.classList.add('fullscreen');
        }
    });

    // QR Code Upload Handling
    function handleFileSelect(event) {
        const file = event.target.files[0];
        if (file) {
            // Use a library to read QR code from the image, like jsQR or others.
            alert('QR code scanned (functionality not implemented yet)');
        }
    }
</script>

</body>
</html>
