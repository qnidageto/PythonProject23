<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }
        header {
            background-color: #333;
            color: white;
            padding: 10px 20px;
            text-align: center;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        input[type="text"] {
            padding: 10px;
            width: 300px;
            margin-bottom: 20px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }

        /* === DESKTOP / DEFAULT SIZE === */
        #video-container {
            margin-top: 20px;
            width: 640px;
            height: 1030px;
            border: 1px solid #ccc;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            background: black;
        }

        #video {
            position: absolute;
            top: -320px;
            left: -50px;
            width: 739px;
            height: 1600px;
            border: none;
        }

        #fullscreen-btn {
            position: absolute;
            bottom: 15px;
            right: 15px;
            padding: 8px 10px;
            background: rgba(0,0,0,0.6);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 18px;
            z-index: 9999;
        }

        #fullscreen-btn:hover {
            background: rgba(0,0,0,0.8);
        }

        /* === MOBILE: MAKE PLAYER SMALLER === */
        @media (max-width: 768px) {
            body {
                background-color: #fff;
            }

            header {
                padding: 8px 10px;
            }

            .container {
                padding: 10px;
            }

            input[type="text"] {
                width: 90vw;
                max-width: 360px;
                font-size: 14px;
                margin-bottom: 10px;
            }

            button {
                font-size: 14px;
                padding: 8px 16px;
            }

            /* Scale down the cropped display to fit on one screen */
            #video-container {
                margin-top: 10px;
                width: 320px;      /* 50% of 640 */
                height: 515px;     /* 50% of 1030 */
            }

            #video {
                top: -160px;       /* 50% of -320 */
                left: -25px;       /* 50% of -50 */
                width: 369.5px;    /* 50% of 739 */
                height: 800px;     /* 50% of 1600 */
            }

            #fullscreen-btn {
                bottom: 8px;
                right: 8px;
                font-size: 16px;
                padding: 6px 8px;
            }
        }
    </style>
</head>
<body>

<header>
    <h1>Stream Viewer</h1>
</header>

<div class="container">

    <input type="text" id="streamURL" value="https://vdo.ninja/?view=" placeholder="Enter stream ID" />
    <button id="goButton">Go</button>

    <div id="video-container">
        <iframe id="video" src="" allow="camera; microphone;" frameborder="0"></iframe>
        <button id="fullscreen-btn">⛶</button>
    </div>

</div>

<script>
    // Go button
    document.getElementById('goButton').addEventListener('click', function() {
        const url = document.getElementById('streamURL').value.trim();
        const urlPattern = /^(https?:\/\/)?(www\.)?vdo\.ninja\/\S+$/;

        if (urlPattern.test(url)) {
            document.getElementById('video').src = url;
        } else {
            alert("Please enter a valid vdo.ninja stream URL.");
        }
    });

    // Fullscreen toggle
    document.getElementById('fullscreen-btn').addEventListener('click', function() {
        const container = document.getElementById('video-container');

        if (!document.fullscreenElement) {
            container.requestFullscreen().catch(err => {
                alert(`Error entering fullscreen: ${err.message}`);
            });
        } else {
            document.exitFullscreen();
        }
    });
</script>

</body>
</html>
