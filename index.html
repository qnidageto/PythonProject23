<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: black;
    overflow: hidden;
    font-family: -apple-system, Arial, sans-serif;
    color: white;
  }

  /* Top bar with input */
  #controls {
    width: 100%;
    padding: 8px;
    box-sizing: border-box;
    background: #111;
  }

  #urlInput {
    width: 70%;
    padding: 8px;
    font-size: 14px;
    border-radius: 6px;
    border: none;
  }

  #loadBtn {
    padding: 8px 16px;
    font-size: 14px;
    border-radius: 6px;
    border: none;
    background: #28a745;
    color: #fff;
    margin-left: 6px;
  }

  /* Container that shows ONLY the cropped part */
  #crop-box {
    position: relative;
    width: 100vw;                 /* fill phone width */
    height: calc(100vw * 2.32);   /* aspect ratio of LXSim screen from your screenshot */
    overflow: hidden;
    margin: 0 auto;
    background: black;
  }

  /* The VDO.Ninja page with the full video */
  #videoFrame {
    position: absolute;

    /* These 4 values are the “magic” crop based on your screenshot */
    width: 151%;     /* zoom in so the LXSim screen fills the box */
    height: auto;
    left: -25.5%;    /* move left so side frame disappears */
    top: -20%;       /* move up so top window bar disappears */

    border: none;
  }
</style>
</head>
<body>

<div id="controls">
  <input id="urlInput" type="text" placeholder="Paste VDO.Ninja VIEW link here">
  <button id="loadBtn" onclick="loadVideo()">Load</button>
</div>

<div id="crop-box">
  <iframe id="videoFrame" src=""></iframe>
</div>

<script>
function loadVideo() {
  const input = document.getElementById('urlInput');
  let url = input.value.trim();
  if (!url) return;

  // basic sanity check
  if (!url.startsWith('http://') && !url.startsWith('https://')) {
    alert('Please paste a valid VDO.Ninja view link.');
    return;
  }

  document.getElementById('videoFrame').src = url;
}
</script>

</body>
</html>
