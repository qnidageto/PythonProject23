<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: black;
    color: white;
    font-family: Arial, sans-serif;
  }

  /* Top bar with input */
  #controls {
    width: 100%;
    padding: 8px;
    box-sizing: border-box;
    background: #111;
  }

  #urlInput {
    width: 70%;
    padding: 8px;
    font-size: 14px;
    border-radius: 6px;
    border: none;
  }

  #loadBtn {
    padding: 8px 14px;
    font-size: 14px;
    border: none;
    background: #28a745;
    color: white;
    border-radius: 6px;
    margin-left: 5px;
  }

  /* Full-screen crop window */
  #crop-box {
    position: fixed;
    top: 44px;               /* height of controls bar */
    left: 0;
    width: 100vw;
    height: calc(100vh - 44px);
    overflow: hidden;
    background: black;
  }

  /* The VDO.Ninja page inside */
  #videoFrame {
    position: absolute;
    top: 50%;
    left: 50%;

    /* ⬇⬇⬇  THESE ARE THE IMPORTANT NUMBERS  ⬇⬇⬇ */
    /* zoom in so the bezel/title bar go off-screen */
    transform: translate(-50%, -50%) scale(1.6);
    transform-origin: center center;

    width: 100vw;
    height: 100vh;
    border: none;
  }
</style>
</head>

<body>

<div id="controls">
  <input type="text" id="urlInput" placeholder="Paste VDO.Ninja view link here">
  <button id="loadBtn" onclick="loadVideo()">Load</button>
</div>

<div id="crop-box">
  <iframe id="videoFrame" src=""></iframe>
</div>
