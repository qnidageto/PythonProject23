<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Stream Viewer</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }

        header {
            background-color: #333;
            color: white;
            padding: 10px 20px;
            text-align: center;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        input[type="text"] {
            padding: 10px;
            width: 300px;
            margin-bottom: 20px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        /* === DESKTOP / DEFAULT SIZE (CROPPED VIEW) === */
        #video-container {
            margin-top: 20px;
            width: 650px;
            height: 1030px;
            border: 1px solid #ccc;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            background: black;
        }

        #video {
            position: absolute;
            top: -310px;
            left: -50px;
            width: 739px;
            height: 1600px;
            border: none;
        }

        #fullscreen-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 10px 14px;
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 22px;
            z-index: 9999;
        }

        #fullscreen-btn:hover {
            background: rgba(0,0,0,0.9);
        }

        /* === MOBILE VERSION === */
        @media (max-width: 768px) {

            .container {
                padding: 10px;
            }

            input[type="text"] {
                width: 90vw;
                max-width: 360px;
                font-size: 14px;
                margin-bottom: 10px;
            }

            button {
                font-size: 14px;
                padding: 8px 16px;
            }

            #video-container {
                margin-top: 10px;
                width: 325px;
                height: 515px;
            }

            #video {
                top: -155px;
                left: -25px;
                width: 369.5px;
                height: 800px;
            }

            #fullscreen-btn {
                top: 6px;
                left: 6px;
                font-size: 20px;
                padding: 8px 10px;
            }
        }

        /* Browser native fullscreen (desktop/Android) */
        #video-container:fullscreen,
        #video-container:-webkit-full-screen {
        }

        /* ===== iOS fake fullscreen ===== */
        #video-container.fake-fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            margin: 0;
            border-radius: 0;
            z-index: 9998;
            transform-origin: top left;
        }
    </style>
</head>
<body>

<header>
    <h1>Stream Viewer</h1>
</header>

<div class="container">

    <input type="text" id="streamURL" value="https://vdo.ninja/?view=Pp3zQwa"
           placeholder="Enter stream URL" />

    <button id="goButton">Go</button>

    <div id="video-container">
        <iframe id="video"
                src=""
                frameborder="0"
                allow="fullscreen; camera; microphone"
                allowfullscreen
                webkitallowfullscreen
                mozallowfullscreen>
        </iframe>

        <button id="fullscreen-btn">⛶</button>
    </div>

</div>

<script>
    /* ====== LOAD STREAM ====== */
    document.getElementById('goButton').addEventListener('click', function () {
        const url = document.getElementById('streamURL').value.trim();
        const urlPattern = /^https?:\/\/[^ ]+$/;

        if (urlPattern.test(url)) {
            document.getElementById('video').src = url;
        } else {
            alert("Please enter a valid stream URL.");
        }
    });

    /* ====== Fullscreen helpers (non-iOS) ====== */
    function openFullscreen(elem) {
        if (!elem) return null;
        if (elem.requestFullscreen) return elem.requestFullscreen();
        if (elem.webkitRequestFullscreen) return elem.webkitRequestFullscreen();
        if (elem.msRequestFullscreen) return elem.msRequestFullscreen();
    }

    function closeFullscreen() {
        if (document.exitFullscreen) return document.exitFullscreen();
        if (document.webkitExitFullscreen) return document.webkitExitFullscreen();
        if (document.msExitFullscreen) return document.msExitFullscreen();
    }

    function isFullscreenActive() {
        return document.fullscreenElement ||
               document.webkitFullscreenElement ||
               document.msFullscreenElement ||
               null;
    }

    /* ====== iOS detection ====== */
    const isIOS =
        /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.userAgent.includes("Mac") && "ontouchend" in document);

    const fsBtn = document.getElementById('fullscreen-btn');
    const container = document.getElementById('video-container');

    /* Scale function: magnify the existing crop */
    function applyFullscreenScale() {
        const rect = container.getBoundingClientRect();
        const scaleX = window.innerWidth / rect.width;
        const scaleY = window.innerHeight / rect.height;
        const scale = Math.min(scaleX, scaleY);
        container.style.transform = `scale(${scale})`;
    }

    fsBtn.addEventListener('click', function () {
        if (isIOS) {
            // Fake fullscreen: same crop, scaled
            const goingFullscreen = !container.classList.contains('fake-fullscreen');

            if (goingFullscreen) {
                container.classList.add('fake-fullscreen');
                applyFullscreenScale();
            } else {
                container.classList.remove('fake-fullscreen');
                container.style.transform = 'none';
            }
        } else {
            // Real fullscreen
            if (!isFullscreenActive()) {
                openFullscreen(container);
            } else {
                closeFullscreen();
            }
        }
    });

    // Recalculate scale if orientation/size changes in fake fullscreen
    window.addEventListener('resize', () => {
        if (isIOS && container.classList.contains('fake-fullscreen')) {
            applyFullscreenScale();
        }
    });
</script>

</body>
</html>
