<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: black;
    color: white;
    font-family: Arial, sans-serif;
  }

  #controls {
    width: 100%;
    padding: 6px;
    box-sizing: border-box;
    background: #111;
    font-size: 12px;
  }

  #urlInput {
    width: 68%;
    padding: 6px;
    font-size: 12px;
    border-radius: 6px;
    border: none;
  }

  #loadBtn {
    padding: 6px 10px;
    font-size: 12px;
    border: none;
    background: #28a745;
    color: white;
    border-radius: 6px;
    margin-left: 4px;
  }

  .slider-row {
    margin-top: 4px;
  }

  .slider-row label {
    display: inline-block;
    width: 60px;
  }

  .slider-row input[type=range] {
    width: 60%;
  }

  #crop-box {
    position: fixed;
    top: 78px; /* height of control area */
    left: 0;
    width: 100vw;
    height: calc(100vh - 78px);
    overflow: hidden;
    background: black;
  }

  #videoFrame {
    position: absolute;
    border: none;
    /* start roughly centered, zoomed a bit */
    transform-origin: center center;
  }
</style>
</head>
<body>

<div id="controls">
  <div>
    <input type="text" id="urlInput" placeholder="Paste VDO.Ninja view link here">
    <button id="loadBtn" onclick="loadVideo()">Load</button>
  </div>

  <div class="slider-row">
    <label for="zoomRange">Zoom</label>
    <input id="zoomRange" type="range" min="1.0" max="3.0" step="0.05" value="1.6">
    <span id="zoomVal">1.6x</span>
  </div>

  <div class="slider-row">
    <label for="xRange">Move X</label>
    <input id="xRange" type="range" min="-200" max="200" step="5" value="0">
    <span id="xVal">0px</span>
  </div>

  <div class="slider-row">
    <label for="yRange">Move Y</label>
    <input id="yRange" type="range" min="-200" max="200" step="5" value="0">
    <span id="yVal">0px</span>
  </div>
</div>

<div id="crop-box">
  <iframe id="videoFrame" src=""></iframe>
</div>

<script>
const frame = document.getElementById('videoFrame');
const zoomRange = document.getElementById('zoomRange');
const xRange = document.getElementById('xRange');
const yRange = document.getElementById('yRange');
const zoomVal = document.getElementById('zoomVal');
const xVal = document.getElementById('xVal');
const yVal = document.getElementById('yVal');

function loadVideo() {
  let url = document.getElementById("urlInput").value.trim();
  if (!url) return;
  if (!url.startsWith("http")) {
    alert("Please paste a full VDO.Ninja view link (starting with http).");
    return;
  }
  frame.src = url;
  // make iframe large enough so zooming/panning has no empty gaps
  frame.style.width = "200vw";
  frame.style.height = "200vh";
  applyTransform();
}

function applyTransform() {
  const z = parseFloat(zoomRange.value);
  const x = parseInt(xRange.value, 10);
  const y = parseInt(yRange.value, 10);

  zoomVal.textContent = z.toFixed(2) + "x";
  xVal.textContent = x + "px";
  yVal.textContent = y + "px";

  // center in the crop box, then offset and zoom
  frame.style.top = "50%";
  frame.style.left = "50%";
  frame.style.transform =
    "translate(" + (x - 50) + "px, " + (y - 50) + "px) scale(" + z + ")";
}

zoomRange.addEventListener('input', applyTransform);
xRange.addEventListener('input', applyTransform);
yRange.addEventListener('input', applyTransform);
</script>

</body>
</html>
