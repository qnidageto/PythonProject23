<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }
        header {
            background-color: #333;
            color: white;
            padding: 10px 20px;
            text-align: center;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        input[type="text"] {
            padding: 10px;
            width: 300px;
            margin-bottom: 20px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        #video-container {
            margin-top: 20px;
            width: 80%;
            max-width: 800px;
            height: 450px; /* Adjusted to a bigger size */
            border: 1px solid #ccc;
            border-radius: 10px;
            overflow: hidden; /* Ensures content outside the container is cropped */
            position: relative;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            object-fit: cover; /* Ensures content fills and crops */
            object-position: center; /* Centers the content */
        }
    </style>
</head>
<body>

<header>
    <h1>Stream Viewer</h1>
</header>

<div class="container">
    <!-- Input Bar for the URL -->
    <input type="text" id="streamURL" value="https://vdo.ninja/?view=" placeholder="Enter stream ID after ?view=" />

    <!-- Go Button -->
    <button id="goButton">Go</button>

    <!-- Video Container with iframe -->
    <div id="video-container">
        <iframe id="video" src="" allow="camera; microphone;" frameborder="0">
            Your browser does not support iframes.
        </iframe>
    </div>
</div>

<script>
    // Handle Go button click
    document.getElementById('goButton').addEventListener('click', function() {
        const baseURL = "https://vdo.ninja/?view=";
        const streamID = document.getElementById('streamURL').value.trim().replace(baseURL, '');

        // Ensure a valid stream ID after ?view=
        if (streamID) {
            // Create full URL and set it in the iframe
            const fullURL = baseURL + streamID;
            document.getElementById('video').src = fullURL;
        } else {
            alert("Please enter a valid stream ID after '?view='.");
        }
    });
</script>

</body>
</html>
