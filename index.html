<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }
        header {
            background-color: #333;
            color: white;
            padding: 10px 20px;
            text-align: center;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        input[type="text"] {
            padding: 10px;
            width: 300px;
            margin-bottom: 20px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        #video-container {
            margin-top: 20px;
            width: 80%;
            max-width: 800px;
            border: 1px solid #ccc;
            border-radius: 10px;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 300px;
            border: none;
            object-fit: cover; /* Ensures content covers the area */
            transition: transform 0.3s ease; /* Smooth transition for scale */
        }
        /* In fullscreen mode, slightly zoom in and center */
        #video-container.fullscreen iframe {
            width: 100%;
            height: 100vh; /* Full viewport height */
            transform: scale(1.05); /* Slight zoom to focus on the center */
            object-position: center top; /* Center the content with a slight top offset */
        }
        .expand-button {
            margin-top: 10px;
            padding: 5px 10px;
            background-color: #008CBA;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .expand-button:hover {
            background-color: #007B8C;
        }
    </style>
</head>
<body>

<header>
    <h1>Stream Viewer</h1>
</header>

<div class="container">
    <!-- Input Bar for the URL -->
    <input type="text" id="streamURL" value="https://vdo.ninja/?push=" placeholder="Enter stream ID after ?push=" />

    <!-- Go Button -->
    <button id="goButton">Go</button>

    <!-- Video Container with iframe -->
    <div id="video-container">
        <iframe id="video" src="" allow="camera; microphone;" frameborder="0">
            Your browser does not support iframes.
        </iframe>
    </div>

    <!-- Expand Button -->
    <button class="expand-button" id="expandButton">Expand to Fullscreen</button>
</div>

<script>
    // Handle Go button click
    document.getElementById('goButton').addEventListener('click', function() {
        const baseURL = "https://vdo.ninja/?push=";
        const streamID = document.getElementById('streamURL').value.trim().replace(baseURL, '');

        if (streamID) {
            // Complete the URL and set the iframe src
            const fullURL = baseURL + streamID;
            document.getElementById('video').src = fullURL;
        } else {
            alert("Please enter a valid stream ID after '?push='.");
        }
    });

    // Handle Fullscreen toggle
    document.getElementById('expandButton').addEventListener('click', function() {
        const videoContainer = document.getElementById('video-container');
        if (videoContainer.classList.contains('fullscreen')) {
            videoContainer.classList.remove('fullscreen');
        } else {
            videoContainer.classList.add('fullscreen');
        }
    });
</script>

</body>
</html>
