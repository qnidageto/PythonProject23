<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: black;
    overflow: hidden;
    font-family: -apple-system, Arial, sans-serif;
    color: white;
  }

  /* Top bar with input */
  #controls {
    width: 100%;
    padding: 8px;
    box-sizing: border-box;
    background: #111;
  }

  #urlInput {
    width: 70%;
    padding: 8px;
    font-size: 14px;
    border-radius: 6px;
    border: none;
  }

  #loadBtn {
    padding: 8px 16px;
    font-size: 14px;
    border-radius: 6px;
    border: none;
    background: #28a745;
    color: #fff;
    margin-left: 6px;
  }

  /* Window that shows only the cropped part */
  #crop-box {
    position: relative;
    width: 100vw;                 /* fill phone width */
    height: calc(100vw * 2.32);   /* same tall ratio as your LXSim screen */
    overflow: hidden;
    margin: 0 auto;
    background: black;
  }

  /* Full VDO.Ninja view, zoomed and shifted so only LXSim is visible */
  #videoFrame {
    position: absolute;

    /* Start with moderate crop values; we can tighten later */
    width: 140%;
    height: auto;
    left: -20%;
    top: -12%;

    border: none;
  }
</style>
</head>
<body>

<div id="controls">
  <input id="urlInput" type="text"
         placeholder="Paste VDO.Ninja VIEW link and press Load or Enter">
  <button id="loadBtn">Load</button>
</div>

<div id="crop-box">
  <!-- default src just to prove it works; you can replace with any view link -->
  <iframe id="videoFrame"
          src="https://vdo.ninja/"
          allow="camera; microphone; autoplay; fullscreen">
  </iframe>
</div>

<script>
function loadVideo() {
  const input = document.getElementById('urlInput');
  let url = input.value.trim();
  if (!url) return;

  if (!url.startsWith('http://') && !url.startsWith('https://')) {
    alert('Please paste a full VDO.Ninja link starting with http…');
    return;
  }

  document.getElementById('videoFrame').src = url;
}

/* Click on button */
document.getElementById('loadBtn').addEventListener('click', loadVideo);

/* Press Enter / Go on keyboard */
document.getElementById('urlInput').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    loadVideo();
  }
});
</script>

</body>
</html>
